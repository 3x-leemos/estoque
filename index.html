<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estoque · Capinhas & Películas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14161B;
    --surface:#1D2027;
    --surface-2:#262A33;
    --text:#F2F0EA;
    --muted:#8A8F9C;
    --accent:#6EE7D8;
    --accent-2:#FF8A5B;
    --danger:#FF6B6B;
    --border:rgba(255,255,255,0.08);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
  }
  .app{
    width:100%;
    max-width:520px;
    min-height:100vh;
    background:var(--bg);
    display:flex;
    flex-direction:column;
    position:relative;
  }
  header{
    padding:28px 20px 20px;
    border-bottom:1px solid var(--border);
  }
  .top-row{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    margin-bottom:18px;
  }
  .eyebrow{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    letter-spacing:0.14em;
    color:var(--accent);
    text-transform:uppercase;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .dot-live{
    width:6px; height:6px; border-radius:50%;
    background:var(--accent);
    animation:pulse 2s infinite;
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(110,231,216,0.45);}
    70%{box-shadow:0 0 0 7px rgba(110,231,216,0);}
    100%{box-shadow:0 0 0 0 rgba(110,231,216,0);}
  }
  .kebab{
    background:none; border:none; color:var(--muted);
    font-size:20px; cursor:pointer; padding:4px 8px;
    border-radius:8px;
  }
  .kebab:active{background:var(--surface-2);}
  h1{
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;
    font-size:15px;
    margin:0 0 16px;
    color:var(--muted);
  }
  .total-value{
    font-family:'JetBrains Mono',monospace;
    font-weight:700;
    font-size:42px;
    line-height:1;
    color:var(--text);
    letter-spacing:-0.01em;
  }
  .total-value span{color:var(--accent-2);}
  .sub-stats{
    margin-top:8px;
    font-size:13px;
    color:var(--muted);
    display:flex;
    gap:14px;
  }
  .controls{
    padding:16px 20px;
    display:flex;
    flex-direction:column;
    gap:10px;
    border-bottom:1px solid var(--border);
  }
  .search{
    display:flex;
    align-items:center;
    gap:8px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:12px;
    padding:10px 12px;
  }
  .search input{
    background:none; border:none; outline:none;
    color:var(--text); font-size:14px; width:100%;
    font-family:'Inter',sans-serif;
  }
  .search input::placeholder{color:var(--muted);}
  .search svg{flex-shrink:0; color:var(--muted);}
  .tabs{ display:flex; gap:6px; }
  .tab{
    font-family:'Inter',sans-serif;
    font-size:12.5px;
    font-weight:600;
    padding:7px 13px;
    border-radius:999px;
    background:var(--surface);
    color:var(--muted);
    border:1px solid var(--border);
    cursor:pointer;
  }
  .tab.active{ background:var(--accent); color:#0E1013; border-color:var(--accent); }
  .list{
    flex:1;
    padding:14px 20px 100px;
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .item-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:14px;
    padding:14px;
  }
  .item-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:8px;
  }
  .item-name-wrap{min-width:0;}
  .item-name{
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;
    font-size:16px;
  }
  .item-meta{
    font-size:12.5px;
    color:var(--muted);
    margin-top:2px;
  }
  .item-tag{
    font-family:'JetBrains Mono',monospace;
    font-size:10px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--muted);
    background:var(--surface-2);
    padding:3px 7px;
    border-radius:6px;
    flex-shrink:0;
  }
  .colors-row{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:12px;
  }
  .color-chip{
    display:flex;
    align-items:center;
    gap:6px;
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:999px;
    padding:5px 10px 5px 6px;
  }
  .color-chip .dot{
    width:13px; height:13px; border-radius:50%;
    border:1px solid rgba(255,255,255,0.2);
    flex-shrink:0;
  }
  .color-chip .cname{ font-size:12px; font-weight:500; }
  .color-chip .cqty{
    font-family:'JetBrains Mono',monospace;
    font-size:11.5px;
    color:var(--muted);
  }
  .color-chip.low .cqty{ color:var(--danger); font-weight:600; }
  .color-chip.zero{ opacity:0.45; }
  .item-bottom{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:12px;
    padding-top:12px;
    border-top:1px solid var(--border);
  }
  .item-nums{
    font-family:'JetBrains Mono',monospace;
    font-size:12.5px;
    color:var(--muted);
    display:flex;
    gap:10px;
  }
  .item-nums b{ color:var(--text); font-weight:600; }
  .item-actions{ display:flex; gap:4px; }
  .icon-btn{
    background:none; border:none; color:var(--muted);
    padding:5px; cursor:pointer; border-radius:7px; display:flex;
  }
  .icon-btn:active{ background:var(--surface-2); color:var(--text); }
  .empty{ text-align:center; padding:60px 20px; color:var(--muted); }
  .empty .big-emoji{ font-size:34px; margin-bottom:10px; }
  .empty p{ font-size:13.5px; line-height:1.5; margin:6px 0 0; }
  .fab{
    position:fixed;
    bottom:26px;
    right:calc(50% - 260px + 20px);
    width:56px; height:56px;
    border-radius:50%;
    background:var(--accent);
    color:#0E1013;
    border:none;
    font-size:26px;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 8px 24px rgba(110,231,216,0.35);
    cursor:pointer;
    z-index:20;
  }
  @media (max-width:520px){ .fab{ right:20px; } }
  .overlay{
    position:fixed; inset:0;
    background:rgba(0,0,0,0.55);
    display:none;
    align-items:flex-end;
    justify-content:center;
    z-index:50;
  }
  .overlay.show{ display:flex; }
  .sheet{
    width:100%;
    max-width:520px;
    background:var(--surface);
    border-radius:20px 20px 0 0;
    padding:22px 20px 28px;
    max-height:88vh;
    overflow-y:auto;
    animation:slideUp 0.22s ease-out;
  }
  @keyframes slideUp{
    from{ transform:translateY(24px); opacity:0; }
    to{ transform:translateY(0); opacity:1; }
  }
  .sheet h2{
    font-family:'Space Grotesk',sans-serif;
    font-size:18px;
    margin:0 0 18px;
  }
  .field{ margin-bottom:14px; }
  .field label{
    display:block;
    font-size:12px;
    color:var(--muted);
    margin-bottom:6px;
    font-weight:600;
  }
  .field input{
    width:100%;
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:10px;
    padding:11px 12px;
    color:var(--text);
    font-size:14.5px;
    font-family:'Inter',sans-serif;
    outline:none;
  }
  .field input:focus{ border-color:var(--accent); }
  .row2{ display:flex; gap:10px; }
  .row2 .field{ flex:1; }
  .type-toggle{ display:flex; gap:8px; }
  .type-toggle button{
    flex:1;
    padding:11px;
    border-radius:10px;
    border:1px solid var(--border);
    background:var(--surface-2);
    color:var(--muted);
    font-weight:600;
    font-size:13.5px;
    cursor:pointer;
  }
  .type-toggle button.active{ background:var(--accent); color:#0E1013; border-color:var(--accent); }
  .colors-editor{
    margin-top:4px;
  }
  .color-row{
    display:flex;
    gap:8px;
    align-items:center;
    margin-bottom:8px;
  }
  .color-row .dot-preview{
    width:32px; height:32px; border-radius:9px;
    flex-shrink:0;
    border:1px solid rgba(255,255,255,0.15);
  }
  .color-row input{
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:9px;
    padding:9px 10px;
    color:var(--text);
    font-size:13.5px;
    font-family:'Inter',sans-serif;
    outline:none;
  }
  .color-row .cname-input{ flex:1; min-width:0; }
  .color-row .cqty-input{ width:64px; font-family:'JetBrains Mono',monospace; }
  .color-row .remove-color{
    background:none; border:none; color:var(--muted);
    cursor:pointer; padding:6px; flex-shrink:0;
  }
  .add-color-btn{
    width:100%;
    padding:10px;
    border-radius:10px;
    border:1px dashed var(--border);
    background:none;
    color:var(--accent);
    font-weight:600;
    font-size:13px;
    cursor:pointer;
    margin-top:2px;
  }
  .sheet-actions{ display:flex; gap:10px; margin-top:20px; }
  .btn{
    flex:1;
    padding:13px;
    border-radius:11px;
    border:none;
    font-weight:600;
    font-size:14.5px;
    cursor:pointer;
    font-family:'Inter',sans-serif;
  }
  .btn-primary{ background:var(--accent); color:#0E1013; }
  .btn-ghost{ background:var(--surface-2); color:var(--text); }
  .confirm-note{
    font-size:12px; color:var(--muted); margin-top:14px; text-align:center; line-height:1.5;
  }
  .toast{
    position:fixed;
    bottom:96px;
    left:50%;
    transform:translateX(-50%);
    background:var(--surface-2);
    border:1px solid var(--border);
    color:var(--text);
    padding:10px 16px;
    border-radius:10px;
    font-size:13px;
    z-index:60;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.25s;
  }
  .toast.show{ opacity:1; }
</style>
</head>
<body>
<div class="app" id="app">

  <header>
    <div class="top-row">
      <div class="eyebrow"><span class="dot-live"></span> ESTOQUE EM TEMPO REAL</div>
      <button class="kebab" id="kebabBtn">⋯</button>
    </div>
    <h1>Capinhas & Películas</h1>
    <div class="total-value" id="totalValue">R$ <span>0,00</span></div>
    <div class="sub-stats" id="subStats">0 modelos cadastrados · 0 unidades em estoque</div>
  </header>

  <div class="controls">
    <div class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="searchInput" placeholder="Buscar por aparelho ou cor...">
    </div>
    <div class="tabs" id="tabs">
      <button class="tab active" data-tipo="Todos">Todos</button>
      <button class="tab" data-tipo="Capinha">Capinhas</button>
      <button class="tab" data-tipo="Película">Películas</button>
    </div>
  </div>

  <div class="list" id="list"></div>

  <button class="fab" id="addBtn">+</button>
</div>

<div class="overlay" id="overlay">
  <div class="sheet">
    <h2 id="sheetTitle">Novo modelo</h2>
    <div class="type-toggle" id="typeToggle">
      <button type="button" data-tipo="Capinha" class="active">Capinha</button>
      <button type="button" data-tipo="Película">Película</button>
    </div>
    <br>
    <div class="field">
      <label>Aparelho</label>
      <input type="text" id="fAparelho" placeholder="Ex: iPhone Xr, Galaxy S23...">
    </div>
    <div class="row2">
      <div class="field">
        <label>Qualidade</label>
        <input type="text" id="fQualidade" placeholder="Ex: Original, 1ª linha...">
      </div>
      <div class="field">
        <label>Valor unitário (R$)</label>
        <input type="number" id="fValor" placeholder="0,00" min="0" step="0.01">
      </div>
    </div>

    <div class="field">
      <label>Cores disponíveis</label>
      <div class="colors-editor" id="colorsEditor"></div>
      <button type="button" class="add-color-btn" id="addColorBtn">+ Adicionar cor</button>
    </div>

    <div class="sheet-actions">
      <button class="btn btn-ghost" id="cancelBtn">Cancelar</button>
      <button class="btn btn-primary" id="saveBtn">Salvar modelo</button>
    </div>
  </div>
</div>

<div class="overlay" id="settingsOverlay">
  <div class="sheet">
    <h2>Configurações</h2>
    <button class="btn btn-ghost" id="closeSettingsBtn" style="width:100%; margin-bottom:10px;">Fechar</button>
    <button class="btn" id="resetBtn" style="width:100%; background:var(--danger); color:#fff;">Apagar todo o estoque</button>
    <p class="confirm-note">Os dados ficam salvos no banco de dados online e sincronizam automaticamente entre todos os dispositivos que abrirem este site.</p>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBuYvhFFyLPpkIB_oktxmQ4DexNfau-XSQ",
  authDomain: "estoque-lemos.firebaseapp.com",
  projectId: "estoque-lemos",
  storageBucket: "estoque-lemos.firebasestorage.app",
  messagingSenderId: "119390092214",
  appId: "1:119390092214:web:8e26f7b45efba3fc815f17"
};
const firebaseApp = initializeApp(firebaseConfig);
const db = getFirestore(firebaseApp);
const stockDocRef = doc(db, 'estoque', 'principal');

let items = [];
let editingId = null;
let editingColors = [];
let activeTab = 'Todos';
let searchTerm = '';

const COLOR_MAP = {
  'preto':'#1c1c1e','preta':'#1c1c1e','branco':'#f2f2f2','branca':'#f2f2f2',
  'azul':'#3b82f6','azul marinho':'#1e3a5f','azul claro':'#7dd3fc','azul escuro':'#1e40af',
  'vermelho':'#ef4444','vermelha':'#ef4444','verde':'#22c55e','verde militar':'#4d5d3a',
  'amarelo':'#eab308','amarela':'#eab308','rosa':'#ec4899','roxo':'#a855f7','roxa':'#a855f7',
  'laranja':'#f97316','cinza':'#8a8f9c','dourado':'#d4af37','dourada':'#d4af37',
  'prata':'#c0c0c0','prateado':'#c0c0c0','transparente':'#d9d9d955','marrom':'#8b5a2b',
  'bege':'#e8dcc8','vinho':'#722f37','turquesa':'#2dd4bf','grafite':'#3a3a3c',
  'nude':'#e3bfa0','coral':'#ff7f6b','lilás':'#c8a2c8','lilas':'#c8a2c8'
};

function colorFor(name){
  if(!name) return '#8A8F9C';
  const key = name.trim().toLowerCase();
  if(COLOR_MAP[key]) return COLOR_MAP[key];
  let hash = 0;
  for(let i=0;i<key.length;i++){ hash = key.charCodeAt(i) + ((hash<<5)-hash); }
  const hue = Math.abs(hash) % 360;
  return `hsl(${hue}, 55%, 55%)`;
}

function fmtMoney(n){
  return (n||0).toLocaleString('pt-BR',{minimumFractionDigits:2, maximumFractionDigits:2});
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}

function migrate(list){
  return (list||[]).map(i=>{
    if(i.colors) return i;
    return {
      id:i.id, tipo:i.tipo, aparelho:i.aparelho, qualidade:i.qualidade||'',
      valor:i.valor||0, colors:[{nome:i.cor||'', quantidade:i.quantidade||0}]
    };
  });
}

let firstSnapshot = true;
onSnapshot(stockDocRef, (snap)=>{
  const data = snap.exists() ? snap.data() : null;
  const fresh = migrate(data && data.items ? data.items : []);
  const changed = JSON.stringify(fresh) !== JSON.stringify(items);
  items = fresh;
  render();
  if(changed && !firstSnapshot) showToast('Estoque atualizado');
  firstSnapshot = false;
}, (err)=>{
  showToast('Erro de conexão com o banco de dados');
});

async function saveItems(){
  try{
    await setDoc(stockDocRef, { items });
  }catch(e){
    showToast('Erro ao sincronizar. Tente novamente.');
  }
}

function itemUnits(item){
  return (item.colors||[]).reduce((s,c)=> s + (c.quantidade||0), 0);
}
function itemSubtotal(item){
  return itemUnits(item) * (item.valor||0);
}

function render(){
  const total = items.reduce((s,i)=> s + itemSubtotal(i), 0);
  const totalUnits = items.reduce((s,i)=> s + itemUnits(i), 0);
  document.getElementById('totalValue').innerHTML = `R$ <span>${fmtMoney(total)}</span>`;
  document.getElementById('subStats').textContent = `${items.length} modelos cadastrados · ${totalUnits} unidades em estoque`;

  let filtered = items.filter(i=>{
    const matchesTab = activeTab==='Todos' || i.tipo===activeTab;
    const term = searchTerm.toLowerCase();
    const matchesSearch = !term || i.aparelho.toLowerCase().includes(term) ||
      (i.colors||[]).some(c=> c.nome.toLowerCase().includes(term));
    return matchesTab && matchesSearch;
  });

  const list = document.getElementById('list');
  if(filtered.length===0){
    list.innerHTML = `<div class="empty">
      <div class="big-emoji">📦</div>
      <div style="font-family:'Space Grotesk',sans-serif; font-weight:600;">Nenhum modelo aqui ainda</div>
      <p>Toque no botão + para cadastrar seu primeiro modelo e as cores disponíveis.</p>
    </div>`;
    return;
  }

  filtered.sort((a,b)=> a.aparelho.localeCompare(b.aparelho));

  list.innerHTML = filtered.map(i=>{
    const units = itemUnits(i);
    const subtotal = itemSubtotal(i);
    const chips = (i.colors||[]).map(c=>{
      const low = c.quantidade>0 && c.quantidade<=2;
      const zero = !c.quantidade;
      return `<div class="color-chip ${low?'low':''} ${zero?'zero':''}">
        <div class="dot" style="background:${colorFor(c.nome)}"></div>
        <span class="cname">${escapeHtml(c.nome)}</span>
        <span class="cqty">${c.quantidade}</span>
      </div>`;
    }).join('');
    return `
    <div class="item-card">
      <div class="item-top">
        <div class="item-name-wrap">
          <div class="item-name">${escapeHtml(i.aparelho)}</div>
          <div class="item-meta">${i.qualidade ? escapeHtml(i.qualidade) : 'Sem qualidade definida'} · R$ ${fmtMoney(i.valor)} un.</div>
        </div>
        <div class="item-tag">${i.tipo}</div>
      </div>
      <div class="colors-row">${chips || '<span style="font-size:12px; color:var(--muted);">Nenhuma cor cadastrada</span>'}</div>
      <div class="item-bottom">
        <div class="item-nums"><b>${units}</b> un. no total · <b>R$ ${fmtMoney(subtotal)}</b></div>
        <div class="item-actions">
          <button class="icon-btn" onclick="openEdit('${i.id}')">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
          </button>
          <button class="icon-btn" onclick="deleteItem('${i.id}')">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"/></svg>
          </button>
        </div>
      </div>
    </div>`;
  }).join('');
}

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderColorsEditor(){
  const wrap = document.getElementById('colorsEditor');
  wrap.innerHTML = editingColors.map((c,idx)=>`
    <div class="color-row">
      <div class="dot-preview" style="background:${colorFor(c.nome)}"></div>
      <input class="cname-input" placeholder="Nome da cor" value="${escapeHtml(c.nome)}" oninput="updateColorField(${idx},'nome',this.value)">
      <input class="cqty-input" type="number" min="0" placeholder="Qtd" value="${c.quantidade}" oninput="updateColorField(${idx},'quantidade',this.value)">
      <button type="button" class="remove-color" onclick="removeColorRow(${idx})">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="M6 6l12 12"/></svg>
      </button>
    </div>
  `).join('');
}

window.updateColorField = function(idx, field, value){
  if(field==='quantidade') editingColors[idx][field] = parseInt(value)||0;
  else editingColors[idx][field] = value;
  if(field==='nome'){
    const dots = document.querySelectorAll('#colorsEditor .dot-preview');
    if(dots[idx]) dots[idx].style.background = colorFor(value);
  }
}

window.removeColorRow = function(idx){
  editingColors.splice(idx,1);
  renderColorsEditor();
}

document.getElementById('addColorBtn').addEventListener('click', ()=>{
  editingColors.push({nome:'', quantidade:0});
  renderColorsEditor();
});

function openNew(){
  editingId = null;
  document.getElementById('sheetTitle').textContent = 'Novo modelo';
  document.getElementById('fAparelho').value = '';
  document.getElementById('fQualidade').value = '';
  document.getElementById('fValor').value = '';
  setTypeToggle('Capinha');
  editingColors = [{nome:'', quantidade:0}];
  renderColorsEditor();
  document.getElementById('overlay').classList.add('show');
}

window.openEdit = function(id){
  const item = items.find(i=>i.id===id);
  if(!item) return;
  editingId = id;
  document.getElementById('sheetTitle').textContent = 'Editar modelo';
  document.getElementById('fAparelho').value = item.aparelho;
  document.getElementById('fQualidade').value = item.qualidade;
  document.getElementById('fValor').value = item.valor;
  setTypeToggle(item.tipo);
  editingColors = JSON.parse(JSON.stringify(item.colors||[]));
  if(editingColors.length===0) editingColors = [{nome:'', quantidade:0}];
  renderColorsEditor();
  document.getElementById('overlay').classList.add('show');
}

window.deleteItem = function(id){
  if(!confirm('Remover este modelo (e todas as suas cores) do estoque?')) return;
  items = items.filter(i=>i.id!==id);
  saveItems();
  render();
  showToast('Modelo removido');
}

function setTypeToggle(tipo){
  document.querySelectorAll('#typeToggle button').forEach(b=>{
    b.classList.toggle('active', b.dataset.tipo===tipo);
  });
}

function getSelectedType(){
  const btn = document.querySelector('#typeToggle button.active');
  return btn ? btn.dataset.tipo : 'Capinha';
}

async function saveItem(){
  const aparelho = document.getElementById('fAparelho').value.trim();
  const qualidade = document.getElementById('fQualidade').value.trim();
  const valor = parseFloat(document.getElementById('fValor').value) || 0;
  const tipo = getSelectedType();
  const colors = editingColors
    .map(c=>({nome:(c.nome||'').trim(), quantidade: c.quantidade||0}))
    .filter(c=>c.nome);

  if(!aparelho){
    showToast('Informe o aparelho');
    return;
  }
  if(colors.length===0){
    showToast('Adicione ao menos uma cor');
    return;
  }

  if(editingId){
    const idx = items.findIndex(i=>i.id===editingId);
    if(idx>-1) items[idx] = {...items[idx], aparelho, qualidade, valor, tipo, colors};
  } else {
    items.push({
      id: Date.now().toString(36) + Math.random().toString(36).slice(2,7),
      aparelho, qualidade, valor, tipo, colors
    });
  }
  await saveItems();
  render();
  document.getElementById('overlay').classList.remove('show');
  showToast(editingId ? 'Modelo atualizado' : 'Modelo adicionado');
}

document.getElementById('addBtn').addEventListener('click', openNew);
document.getElementById('cancelBtn').addEventListener('click', ()=> document.getElementById('overlay').classList.remove('show'));
document.getElementById('saveBtn').addEventListener('click', saveItem);

document.getElementById('typeToggle').addEventListener('click', (e)=>{
  const btn = e.target.closest('button');
  if(!btn) return;
  setTypeToggle(btn.dataset.tipo);
});

document.getElementById('tabs').addEventListener('click', (e)=>{
  const btn = e.target.closest('.tab');
  if(!btn) return;
  activeTab = btn.dataset.tipo;
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active', b===btn));
  render();
});

document.getElementById('searchInput').addEventListener('input', (e)=>{
  searchTerm = e.target.value;
  render();
});

document.getElementById('kebabBtn').addEventListener('click', ()=> document.getElementById('settingsOverlay').classList.add('show'));
document.getElementById('closeSettingsBtn').addEventListener('click', ()=> document.getElementById('settingsOverlay').classList.remove('show'));
document.getElementById('resetBtn').addEventListener('click', async ()=>{
  if(!confirm('Isso vai apagar TODOS os modelos do estoque, para todos os dispositivos. Continuar?')) return;
  items = [];
  await saveItems();
  render();
  document.getElementById('settingsOverlay').classList.remove('show');
  showToast('Estoque apagado');
});

document.querySelectorAll('.overlay').forEach(ov=>{
  ov.addEventListener('click', (e)=>{
    if(e.target===ov) ov.classList.remove('show');
  });
});

render();
</script>
</body>
</html>
