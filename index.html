<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SmartAssist</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{

background:#f2f5f9;
padding:30px;

}

.container{

max-width:1400px;
margin:auto;

}

h1{

margin-bottom:20px;
color:#2563eb;

}

.cards{

display:flex;
gap:20px;
margin-bottom:20px;

}

.card{

background:white;
padding:20px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,.08);
flex:1;

}

.card h2{

font-size:32px;
margin-top:10px;

}

.formulario{

background:white;
padding:20px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,.08);
margin-bottom:20px;

}

.grid{

display:grid;
grid-template-columns:repeat(4,1fr);
gap:10px;

}

input,select{

padding:12px;
border:1px solid #ddd;
border-radius:8px;

}

button{

padding:12px;
border:none;
background:#2563eb;
color:white;
border-radius:8px;
cursor:pointer;

}

button:hover{

opacity:.9;

}

#pesquisa{

margin-top:20px;
width:100%;

}

table{

width:100%;
margin-top:20px;
border-collapse:collapse;
background:white;

}

th{

background:#2563eb;
color:white;
padding:12px;

}

td{

padding:10px;
border-bottom:1px solid #eee;
text-align:center;

}

.editar{

background:#16a34a;

}

.excluir{

background:#dc2626;

}

.acoes{

display:flex;
gap:5px;
justify-content:center;

}

</style>

</head>

<body>

<div class="container">

<h1>📦 SmartAssist Estoque</h1>

<div class="cards">

<div class="card">

Produtos

<h2 id="totalProdutos">0</h2>

</div>

<div class="card">

Itens

<h2 id="totalItens">0</h2>

</div>

</div>

<div class="formulario">

<div class="grid">

<input id="nome" placeholder="Nome">

<select id="categoria">

<option>Capinha</option>

<option>Película</option>

<option>Cabo</option>

<option>Carregador</option>

<option>Tela</option>

<option>Bateria</option>

<option>Peça</option>

<option>Outro</option>

</select>

<input id="modelo" placeholder="Modelo">

<input id="cor" placeholder="Cor">

<input id="quantidade" type="number" placeholder="Quantidade">

<input id="valor" type="number" step="0.01" placeholder="Valor Venda">

<input id="localizacao" placeholder="Localização">

<button onclick="salvarProduto()">Salvar Produto</button>

</div>

<input
id="pesquisa"
placeholder="Pesquisar..."
onkeyup="renderizar()"
>

</div>

<table>

<thead>

<tr>

<th>Nome</th>

<th>Categoria</th>

<th>Modelo</th>

<th>Cor</th>

<th>Qtd</th>

<th>Valor</th>

<th>Local</th>

<th>Ações</th>

</tr>

</thead>

<tbody id="tabela">

</tbody>

</table>

</div>

<script>

let produtos =
JSON.parse(localStorage.getItem("produtos")) || [];

let editando = null;

function salvarLocal(){

localStorage.setItem(
"produtos",
JSON.stringify(produtos)
);

}

function salvarProduto(){

const produto={

id:
editando ?? Date.now(),

nome:
document.getElementById("nome").value,

categoria:
document.getElementById("categoria").value,

modelo:
document.getElementById("modelo").value,

cor:
document.getElementById("cor").value,

quantidade:Number(document.getElementById("quantidade").value),

valor:Number(document.getElementById("valor").value),

localizacao:
document.getElementById("localizacao").value

};

if(editando){

const index=
produtos.findIndex(p=>p.id==editando);

produtos[index]=produto;

editando=null;

}else{

produtos.push(produto);

}

salvarLocal();

limparFormulario();

renderizar();

}

function limparFormulario(){

nome.value="";
modelo.value="";
cor.value="";
quantidade.value="";
valor.value="";
localizacao.value="";

}
function renderizar(){

const pesquisa=document
.getElementById("pesquisa")
.value
.toLowerCase();

const tabela=document
.getElementById("tabela");

tabela.innerHTML="";

let totalItens=0;

const filtrados=produtos.filter(p=>{

return(

p.nome.toLowerCase().includes(pesquisa) ||

p.modelo.toLowerCase().includes(pesquisa) ||

p.categoria.toLowerCase().includes(pesquisa) ||

p.cor.toLowerCase().includes(pesquisa)

);

});

filtrados.forEach(produto=>{

totalItens+=produto.quantidade;

tabela.innerHTML+=`

<tr>

<td>${produto.nome}</td>

<td>${produto.categoria}</td>

<td>${produto.modelo}</td>

<td>${produto.cor}</td>

<td>${produto.quantidade}</td>

<td>

R$ ${produto.valor.toFixed(2)}

</td>

<td>${produto.localizacao}</td>

<td>

<div class="acoes">

<button
class="editar"
onclick="editar(${produto.id})"
>

Editar

</button>

<button
class="excluir"
onclick="excluir(${produto.id})"
>

Excluir

</button>

</div>

</td>

</tr>

`;

});

document
.getElementById("totalProdutos")
.innerHTML=filtrados.length;

document
.getElementById("totalItens")
.innerHTML=totalItens;

}

function editar(id){

const produto=

produtos.find(p=>p.id==id);

editando=id;

document
.getElementById("nome")
.value=produto.nome;

document
.getElementById("categoria")
.value=produto.categoria;

document
.getElementById("modelo")
.value=produto.modelo;

document
.getElementById("cor")
.value=produto.cor;

document
.getElementById("quantidade")
.value=produto.quantidade;

document
.getElementById("valor")
.value=produto.valor;

document
.getElementById("localizacao")
.value=produto.localizacao;

window.scrollTo({

top:0,

behavior:"smooth"

});

}

function excluir(id){

if(!confirm("Excluir produto?"))

return;

produtos=

produtos.filter(p=>p.id!=id);

salvarLocal();

renderizar();

}

renderizar();
function exportarBackup(){

const dados=
JSON.stringify(produtos,null,2);

const blob=
new Blob([dados],{
type:"application/json"
});

const link=
document.createElement("a");

link.href=
URL.createObjectURL(blob);

link.download=
"backup-smartassist.json";

link.click();

}

function importarBackup(event){

const arquivo=
event.target.files[0];

if(!arquivo) return;

const leitor=
new FileReader();

leitor.onload=function(e){

produtos=
JSON.parse(e.target.result);

salvarLocal();

renderizar();

}

leitor.readAsText(arquivo);

}

function limparTudo(){

if(!confirm("Deseja apagar TODOS os produtos?"))
return;

produtos=[];

salvarLocal();

renderizar();

}
