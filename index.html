<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estoque · Capinhas & Películas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #14161B;
      --surface: #1D2027;
      --surface-2: #262A33;
      --text: #F2F0EA;
      --muted: #8A8F9C;
      --accent: #6EE7D8;
      --accent-2: #FF8A5B;
      --danger: #FF6B6B;
      --border: rgba(255, 255, 255, 0.08);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 520px;
      min-height: 100vh;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    header {
      padding: 28px 20px 20px;
      border-bottom: 1px solid var(--border);
    }

    .top-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 18px;
    }

    .eyebrow {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.14em;
      color: var(--accent);
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dot-live {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 0 rgba(110, 231, 216, 0.6);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% {
        box-shadow: 0 0 0 0 rgba(110, 231, 216, 0.45);
      }
      70% {
        box-shadow: 0 0 0 7px rgba(110, 231, 216, 0);
      }
      100% {
        box-shadow: 0 0 0 0 rgba(110, 231, 216, 0);
      }
    }

    .kebab {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 20px;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 8px;
    }

    .kebab:active {
      background: var(--surface-2);
    }

    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 600;
      font-size: 24px;
      margin: 0 0 16px;
      color: var(--text);
    }

    .total-value {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      font-size: 42px;
      line-height: 1;
      color: var(--text);
      letter-spacing: -0.01em;
    }

    .total-value span {
      color: var(--accent-2);
    }

    .sub-stats {
      margin-top: 8px;
      font-size: 13px;
      color: var(--muted);
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
    }

    .controls {
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-bottom: 1px solid var(--border);
    }

    .search {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
    }

    .search input {
      background: none;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 14px;
      width: 100%;
      font-family: 'Inter', sans-serif;
    }

    .search input::placeholder {
      color: var(--muted);
    }

    .search svg {
      flex-shrink: 0;
      color: var(--muted);
    }

    .tabs {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .tab {
      font-family: 'Inter', sans-serif;
      font-size: 12.5px;
      font-weight: 600;
      padding: 7px 13px;
      border-radius: 999px;
      background: var(--surface);
      color: var(--muted);
      border: 1px solid var(--border);
      cursor: pointer;
    }

    .tab.active {
      background: var(--accent);
      color: #0E1013;
      border-color: var(--accent);
    }

    .list {
      flex: 1;
      padding: 14px 20px 100px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .item-card {
      display: flex;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
    }

    .color-bar {
      width: 7px;
      flex-shrink: 0;
    }

    .item-body {
      flex: 1;
      padding: 13px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 0;
    }

    .item-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }

    .item-name {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 600;
      font-size: 15px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .item-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      background: var(--surface-2);
      padding: 3px 7px;
      border-radius: 6px;
      flex-shrink: 0;
    }

    .item-meta {
      font-size: 12.5px;
      color: var(--muted);
    }

    .item-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 4px;
      gap: 10px;
      flex-wrap: wrap;
    }

    .item-nums {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .item-nums b {
      color: var(--text);
      font-weight: 600;
    }

    .low-stock {
      color: var(--danger) !important;
    }

    .item-actions {
      display: flex;
      gap: 4px;
    }

    .icon-btn {
      background: none;
      border: none;
      color: var(--muted);
      padding: 5px;
      cursor: pointer;
      border-radius: 7px;
      display: flex;
    }

    .icon-btn:active {
      background: var(--surface-2);
      color: var(--text);
    }

    .empty {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }

    .empty .big-emoji {
      font-size: 34px;
      margin-bottom: 10px;
    }

    .empty p {
      font-size: 13.5px;
      line-height: 1.5;
      margin: 6px 0 0;
    }

    .fab {
      position: fixed;
      bottom: 26px;
      right: calc(50% - 260px + 20px);
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--accent);
      color: #0E1013;
      border: none;
      font-size: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(110, 231, 216, 0.35);
      cursor: pointer;
      z-index: 20;
    }

    @media (max-width: 520px) {
      .fab {
        right: 20px;
      }
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 50;
    }

    .overlay.show {
      display: flex;
    }

    .sheet {
      width: 100%;
      max-width: 520px;
      background: var(--surface);
      border-radius: 20px 20px 0 0;
      padding: 22px 20px 28px;
      max-height: 88vh;
      overflow-y: auto;
      animation: slideUp 0.22s ease-out;
    }

    @keyframes slideUp {
      from {
        transform: translateY(24px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .sheet h2 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 18px;
      margin: 0 0 18px;
    }

    .field {
      margin-bottom: 14px;
    }

    .field label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
      font-weight: 600;
    }

    .field input {
      width: 100%;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 11px 12px;
      color: var(--text);
      font-size: 14.5px;
      font-family: 'Inter', sans-serif;
      outline: none;
    }

    .field input:focus {
      border-color: var(--accent);
    }

    .variant-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .variant-row {
      display: grid;
      grid-template-columns: 1.4fr 0.8fr 0.8fr auto;
      gap: 10px;
      align-items: center;
    }

    .variant-row .field {
      margin-bottom: 0;
    }

    .variant-row input {
      background: var(--surface);
    }

    .variant-delete {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 10px;
      padding: 10px 12px;
      cursor: pointer;
      font-size: 14px;
    }

    .variant-delete:hover {
      background: rgba(255, 255, 255, 0.05);
    }

    .variant-list-view {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 10px;
    }

    .variant-row-view {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--surface-2);
      border-radius: 12px;
      padding: 10px 12px;
    }

    .variant-color {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.2);
      flex-shrink: 0;
    }

    .variant-row-view.low-stock span {
      color: var(--danger);
    }

    .row2 {
      display: flex;
      gap: 10px;
    }

    .row2 .field {
      flex: 1;
    }

    .type-toggle {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .type-toggle button {
      flex: 1;
      padding: 11px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--muted);
      font-weight: 600;
      font-size: 13.5px;
      cursor: pointer;
    }

    .type-toggle button.active {
      background: var(--accent);
      color: #0E1013;
      border-color: var(--accent);
    }

    .color-preview {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 6px;
    }

    .color-preview .dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .color-preview span {
      font-size: 11.5px;
      color: var(--muted);
    }

    .sheet-actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .btn {
      flex: 1;
      padding: 13px;
      border-radius: 11px;
      border: none;
      font-weight: 600;
      font-size: 14.5px;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
    }

    .btn-primary {
      background: var(--accent);
      color: #0E1013;
    }

    .btn-ghost {
      background: var(--surface-2);
      color: var(--text);
    }

    .confirm-note {
      font-size: 12px;
      color: var(--muted);
      margin-top: 14px;
      text-align: center;
      line-height: 1.5;
    }

    .toast {
      position: fixed;
      bottom: 96px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 13px;
      z-index: 60;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
    }

    .toast.show {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="app" id="app">
    <header>
      <div class="top-row">
        <div class="eyebrow">
          <span class="dot-live"></span> ESTOQUE EM TEMPO REAL
        </div>
        <button class="kebab" id="kebabBtn">⋯</button>
      </div>
      <h1>Capinhas & Películas</h1>
      <div class="total-value" id="totalValue">R$ <span>0,00</span></div>
      <div class="sub-stats" id="subStats">0 itens cadastrados · 0 unidades em estoque</div>
    </header>

    <div class="controls">
      <div class="search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="searchInput" placeholder="Buscar por aparelho ou cor..." />
      </div>
      <div class="tabs" id="tabs">
        <button class="tab active" data-tipo="Todos">Todos</button>
        <button class="tab" data-tipo="Capinha">Capinhas</button>
        <button class="tab" data-tipo="Película">Películas</button>
      </div>
    </div>

    <div class="list" id="list"></div>

    <button class="fab" id="addBtn">+</button>
  </div>

  <div class="overlay" id="overlay">
    <div class="sheet">
      <h2 id="sheetTitle">Novo item</h2>
      <div class="type-toggle" id="typeToggle">
        <button type="button" class="active" data-tipo="Capinha">Capinha</button>
        <button type="button" data-tipo="Película">Película</button>
      </div>
      <div class="field">
        <label for="fAparelho">Aparelho</label>
        <input type="text" id="fAparelho" placeholder="Ex: iPhone 14" />
      </div>
      <div class="field">
        <label for="fQualidade">Qualidade</label>
        <input type="text" id="fQualidade" placeholder="Ex: Original, 1ª linha..." />
      </div>
      <div class="field">
        <label>Cores disponíveis</label>
        <div class="variant-list" id="variantList"></div>
        <button class="btn btn-ghost" id="addVariantBtn" type="button" style="margin-top: 8px;">Adicionar cor</button>
      </div>
      <div class="sheet-actions">
        <button class="btn btn-ghost" id="cancelBtn" type="button">Cancelar</button>
        <button class="btn btn-primary" id="saveBtn" type="button">Salvar item</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="settingsOverlay">
    <div class="sheet">
      <h2>Configurações</h2>
      <button class="btn btn-ghost" id="closeSettingsBtn" type="button" style="width:100%; margin-bottom:10px;">Fechar</button>
      <button class="btn" id="resetBtn" type="button" style="width:100%; background:var(--danger); color:#fff;">Apagar todo o estoque</button>
      <p class="confirm-note">Os dados deste estoque são compartilhados entre todos os dispositivos que abrem esta página — pense nela como o "banco de dados" da sua loja.</p>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const STORAGE_KEY = 'estoque-capinhas-peliculas:itens';
    const REMOTE_STORAGE_URL = 'https://www.jsonstore.io/estoque-capinhas-peliculas';
    const SYNC_POLL_MS = 5000;
    let itens = [];
    let editingId = null;
    let activeTab = 'Todos';
    let searchTerm = '';
    let syncTimer = null;

    const COLOR_MAP = {
      'preto': '#1c1c1e', 'preta': '#1c1c1e', 'branco': '#f2f2f2', 'branca': '#f2f2f2',
      'azul': '#3b82f6', 'azul marinho': '#1e3a5f', 'azul claro': '#7dd3fc', 'azul escuro': '#1e40af',
      'vermelho': '#ef4444', 'vermelha': '#ef4444', 'verde': '#22c55e', 'verde militar': '#4d5d3a',
      'amarelo': '#eab308', 'amarela': '#eab308', 'rosa': '#ec4899', 'roxo': '#a855f7', 'roxa': '#a855f7',
      'laranja': '#f97316', 'cinza': '#8a8f9c', 'dourado': '#d4af37', 'dourada': '#d4af37',
      'prata': '#c0c0c0', 'prateado': '#c0c0c0', 'transparente': '#d9d9d955', 'marrom': '#8b5a2b',
      'bege': '#e8dcc8', 'vinho': '#722f37', 'turquesa': '#2dd4bf', 'grafite': '#3a3a3c',
      'nude': '#e3bfa0', 'coral': '#ff7f6b', 'lilás': '#c8a2c8', 'lilas': '#c8a2c8'
    };

    function colorFor(name) {
      if (!name) return '#8A8F9C';
      const key = name.trim().toLowerCase();
      if (COLOR_MAP[key]) return COLOR_MAP[key];
      let hash = 0;
      for (let i = 0; i < key.length; i++) {
        hash = key.charCodeAt(i) + ((hash << 5) - hash);
      }
      const hue = Math.abs(hash) % 360;
      return `hsl(${hue}, 55%, 55%)`;
    }

    function fmtMoney(n) {
      return (n || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(t.hideTimer);
      t.hideTimer = setTimeout(() => t.classList.remove('show'), 1800);
    }

    function saveItems() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(itens));
      saveRemoteItems();
    }

    async function saveRemoteItems() {
      try {
        const response = await fetch(REMOTE_STORAGE_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ items: itens, updatedAt: Date.now() })
        });
        const result = await response.json();
        if (!result || (!result.ok && !result.result)) {
          throw new Error('Não foi possível salvar no servidor');
        }
      } catch (e) {
        console.warn('Sync remoto falhou:', e);
      }
    }

    async function loadItems(silent = false) {
      let loadedRemote = false;

      try {
        const response = await fetch(REMOTE_STORAGE_URL);
        if (response.ok) {
          const result = await response.json();
          const fresh = result && result.result && result.result.items ? result.result.items : [];
          if (JSON.stringify(fresh) !== JSON.stringify(itens)) {
            itens = fresh.map(item => ({ ...item, variantes: item.variantes || [] }));
            localStorage.setItem(STORAGE_KEY, JSON.stringify(itens));
            render();
            if (silent) showToast('Estoque atualizado');
          }
          loadedRemote = true;
        }
      } catch (e) {
        console.warn('Falha ao carregar dados remotos:', e);
      }

      if (!loadedRemote) {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          const fresh = raw ? JSON.parse(raw) : [];
          if (JSON.stringify(fresh) !== JSON.stringify(itens)) {
            itens = fresh.map(item => ({ ...item, variantes: item.variantes || [] }));
            render();
            if (silent) showToast('Estoque atualizado');
          }
        } catch (e) {
          itens = itens || [];
          render();
        }
      }
    }

    function escapeHtml(s) {
      return (s || '').replace(/[&<>"']/g, c => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[c]));
    }

    function render() {
      const total = itens.reduce((s, i) => {
        const variants = i.variantes || [];
        return s + variants.reduce((sum, v) => sum + (v.quantidade * v.valor), 0);
      }, 0);
      const totalUnidades = itens.reduce((s, i) => {
        const variants = i.variantes || [];
        return s + variants.reduce((sum, v) => sum + v.quantidade, 0);
      }, 0);
      document.getElementById('totalValue').innerHTML = `R$ <span>${fmtMoney(total)}</span>`;
      document.getElementById('subStats').textContent = `${itens.length} modelos cadastrados · ${totalUnidades} unidades em estoque`;

      const filtered = itens.filter(i => {
        const matchesTab = activeTab === 'Todos' || i.tipo === activeTab;
        const term = searchTerm.toLowerCase();
        const variants = i.variantes || [];
        const matchesSearch = !term || i.aparelho.toLowerCase().includes(term) || variants.some(v => v.cor.toLowerCase().includes(term));
        return matchesTab && matchesSearch;
      });

      const list = document.getElementById('list');
      if (filtered.length === 0) {
        list.innerHTML = `
          <div class="empty">
            <div class="big-emoji">📦</div>
            <div style="font-family:'Space Grotesk',sans-serif; font-weight:600;">Nenhum item aqui ainda</div>
            <p>Toque no botão + para cadastrar sua primeira capinha ou película.</p>
          </div>`;
        return;
      }

      filtered.sort((a, b) => a.aparelho.localeCompare(b.aparelho));
      list.innerHTML = filtered.map(i => {
        const variants = i.variantes || [];
        const subtotal = variants.reduce((sum, v) => sum + v.quantidade * v.valor, 0);
        return `
          <div class="item-card">
            <div class="item-body">
              <div class="item-top">
                <div>
                  <div class="item-name">${escapeHtml(i.aparelho)}</div>
                  <div class="item-meta">${escapeHtml(i.tipo)}${i.qualidade ? ' · ' + escapeHtml(i.qualidade) : ''}</div>
                </div>
                <div class="item-actions">
                  <button class="icon-btn" onclick="openEdit('${i.id}')">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
                  </button>
                  <button class="icon-btn" onclick="deleteItem('${i.id}')">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"/></svg>
                  </button>
                </div>
              </div>
              <div class="variant-list-view">
                ${i.variantes.map(v => {
                  const low = v.quantidade <= 2;
                  return `
                    <div class="variant-row-view ${low ? 'low-stock' : ''}">
                      <span class="variant-color" style="background:${colorFor(v.cor)}"></span>
                      <span>${escapeHtml(v.cor)} · <b>${v.quantidade}</b> un · R$ <b>${fmtMoney(v.valor)}</b></span>
                    </div>`;
                }).join('')}
              </div>
              <div class="item-bottom">
                <div class="item-nums">
                  <span><b>${fmtMoney(subtotal)}</b> no total</span>
                </div>
              </div>
            </div>
          </div>`;
      }).join('');
    }

    function createVariantRow(variant = {}) {
      const rowId = variant.id || Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
      return `
        <div class="variant-row" data-id="${rowId}">
          <div class="field">
            <input type="text" class="variant-cor" placeholder="Cor" value="${escapeHtml(variant.cor || '')}" />
          </div>
          <div class="field">
            <input type="number" class="variant-quantidade" placeholder="Qtd" min="0" value="${variant.quantidade != null ? variant.quantidade : ''}" />
          </div>
          <div class="field">
            <input type="number" class="variant-valor" placeholder="Valor" min="0" step="0.01" value="${variant.valor != null ? variant.valor : ''}" />
          </div>
          <button class="variant-delete" type="button">✕</button>
        </div>`;
    }

    function renderVariantRows(variantes = []) {
      const variantList = document.getElementById('variantList');
      variantList.innerHTML = '';
      if (variantes.length === 0) {
        variantes = [{ id: Date.now().toString(36), cor: '', quantidade: '', valor: '' }];
      }
      variantes.forEach(variant => {
        variantList.insertAdjacentHTML('beforeend', createVariantRow(variant));
      });
    }

    function getVariantRows() {
      return Array.from(document.querySelectorAll('.variant-row')).map(row => {
        return {
          id: row.dataset.id,
          cor: row.querySelector('.variant-cor').value.trim(),
          quantidade: parseInt(row.querySelector('.variant-quantidade').value, 10) || 0,
          valor: parseFloat(row.querySelector('.variant-valor').value) || 0
        };
      }).filter(v => v.cor || v.quantidade || v.valor);
    }

    function openOverlay() {
      editingId = null;
      document.getElementById('sheetTitle').textContent = 'Novo item';
      document.getElementById('fAparelho').value = '';
      document.getElementById('fQualidade').value = '';
      setTypeToggle('Capinha');
      renderVariantRows([]);
      document.getElementById('overlay').classList.add('show');
    }

    window.openEdit = function(id) {
      const item = itens.find(i => i.id === id);
      if (!item) return;
      editingId = id;
      document.getElementById('sheetTitle').textContent = 'Editar item';
      document.getElementById('fAparelho').value = item.aparelho;
      document.getElementById('fQualidade').value = item.qualidade;
      setTypeToggle(item.tipo);
      renderVariantRows(item.variantes || []);
      document.getElementById('overlay').classList.add('show');
    };

    window.deleteItem = function(id) {
      if (!confirm('Remover este item do estoque?')) return;
      itens = itens.filter(i => i.id !== id);
      saveItems();
      render();
      showToast('Item removido');
    };

    function setTypeToggle(tipo) {
      document.querySelectorAll('#typeToggle button').forEach(b => {
        b.classList.toggle('active', b.dataset.tipo === tipo);
      });
    }

    function getSelectedType() {
      const btn = document.querySelector('#typeToggle button.active');
      return btn ? btn.dataset.tipo : 'Capinha';
    }

    function saveItem() {
      const aparelho = document.getElementById('fAparelho').value.trim();
      const qualidade = document.getElementById('fQualidade').value.trim();
      const tipo = getSelectedType();
      const variantes = getVariantRows().filter(v => v.cor && v.quantidade > 0 && v.valor >= 0);

      if (!aparelho) {
        showToast('Informe o aparelho');
        return;
      }

      if (variantes.length === 0) {
        showToast('Adicione ao menos uma cor válida');
        return;
      }

      if (editingId) {
        const idx = itens.findIndex(i => i.id === editingId);
        if (idx > -1) {
          itens[idx] = { ...itens[idx], aparelho, qualidade, tipo, variantes };
        }
      } else {
        itens.push({
          id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
          aparelho,
          qualidade,
          tipo,
          variantes
        });
      }

      saveItems();
      render();
      document.getElementById('overlay').classList.remove('show');
      showToast(editingId ? 'Item atualizado' : 'Item adicionado');
    }

    document.getElementById('addBtn').addEventListener('click', openOverlay);
    document.getElementById('cancelBtn').addEventListener('click', () => {
      document.getElementById('overlay').classList.remove('show');
    });
    document.getElementById('saveBtn').addEventListener('click', saveItem);
    document.getElementById('addVariantBtn').addEventListener('click', () => {
      const variantList = document.getElementById('variantList');
      variantList.insertAdjacentHTML('beforeend', createVariantRow({ id: Date.now().toString(36) }));
    });
    document.getElementById('variantList').addEventListener('click', (e) => {
      const deleteBtn = e.target.closest('.variant-delete');
      if (!deleteBtn) return;
      const row = deleteBtn.closest('.variant-row');
      if (row) row.remove();
    });

    document.getElementById('typeToggle').addEventListener('click', (e) => {
      const btn = e.target.closest('button');
      if (!btn) return;
      setTypeToggle(btn.dataset.tipo);
    });

    document.getElementById('tabs').addEventListener('click', (e) => {
      const btn = e.target.closest('.tab');
      if (!btn) return;
      activeTab = btn.dataset.tipo;
      document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b === btn));
      render();
    });

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchTerm = e.target.value;
      render();
    });

    document.getElementById('kebabBtn').addEventListener('click', () => {
      document.getElementById('settingsOverlay').classList.add('show');
    });

    document.getElementById('closeSettingsBtn').addEventListener('click', () => {
      document.getElementById('settingsOverlay').classList.remove('show');
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
      if (!confirm('Isso vai apagar TODOS os itens do estoque, para todos os dispositivos. Continuar?')) return;
      itens = [];
      saveItems();
      render();
      document.getElementById('settingsOverlay').classList.remove('show');
      showToast('Estoque apagado');
    });

    document.querySelectorAll('.overlay').forEach(ov => {
      ov.addEventListener('click', (e) => {
        if (e.target === ov) ov.classList.remove('show');
      });
    });

    loadItems().then(() => {
      render();
      syncTimer = setInterval(() => loadItems(true), SYNC_POLL_MS);
    });
  </script>
</body>
</html>
