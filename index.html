<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SmartAssist - Estoque</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#eef2f7;
    color:#1f2937;
    padding:30px;
}

.container{
    max-width:1400px;
    margin:auto;
}

header{
    margin-bottom:30px;
}

header h1{
    color:#2563eb;
    font-size:34px;
    margin-bottom:5px;
}

header p{
    color:#6b7280;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    margin-bottom:25px;
}

.card{
    background:#fff;
    border-radius:12px;
    padding:20px;
    box-shadow:0 4px 15px rgba(0,0,0,.08);
    transition:.2s;
}

.card:hover{
    transform:translateY(-3px);
}

.card h3{
    color:#6b7280;
    font-size:15px;
    font-weight:500;
}

.card h2{
    margin-top:10px;
    font-size:32px;
    color:#2563eb;
}

.cadastro{
    background:#fff;
    padding:25px;
    border-radius:12px;
    box-shadow:0 4px 15px rgba(0,0,0,.08);
    margin-bottom:25px;
}

.login{
    background:#fff;
    padding:25px;
    border-radius:12px;
    box-shadow:0 4px 15px rgba(0,0,0,.08);
    margin-bottom:25px;
}

.login h2{
    margin-bottom:20px;
    color:#111827;
}

.login input{
    width:100%;
}

.cadastro h2{
    margin-bottom:20px;
    color:#111827;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:18px;
}

.grid div{
    display:flex;
    flex-direction:column;
}

label{
    margin-bottom:6px;
    font-size:14px;
    font-weight:500;
}

input,
select{
    padding:12px;
    border:1px solid #d1d5db;
    border-radius:8px;
    outline:none;
    transition:.2s;
}

input:focus,
select:focus{
    border-color:#2563eb;
    box-shadow:0 0 0 3px rgba(37,99,235,.15);
}

.botaoSalvar{
    display:flex;
    align-items:flex-end;
}

#btnSalvar{
    width:100%;
    padding:13px;
    background:#2563eb;
    color:#fff;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:15px;
    font-weight:600;
    transition:.2s;
}

#btnSalvar:hover{
    background:#1d4ed8;
}

.pesquisa{
    margin-bottom:20px;
}

#pesquisa{
    width:100%;
    padding:14px;
    border-radius:8px;
    border:1px solid #d1d5db;
}

.acoes{
    display:flex;
    gap:10px;
    margin-bottom:20px;
    flex-wrap:wrap;
}

.acoes button,
.importar{
    padding:12px 18px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    color:#fff;
    font-weight:600;
    background:#2563eb;
    display:inline-flex;
    align-items:center;
    justify-content:center;
}

.importar{
    background:#16a34a;
}

.limpar{
    background:#dc2626 !important;
}

.tabela{
    background:#fff;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 4px 15px rgba(0,0,0,.08);
}

table{
    width:100%;
    border-collapse:collapse;
}

thead{
    background:#2563eb;
    color:#fff;
}

th{
    padding:14px;
    text-align:center;
}

td{
    padding:12px;
    border-bottom:1px solid #ececec;
    text-align:center;
}

tbody tr:hover{
    background:#f8fafc;
}

.btnEditar{
    background:#16a34a;
    color:#fff;
    border:none;
    padding:8px 12px;
    border-radius:6px;
    cursor:pointer;
    margin-right:6px;
}

.btnExcluir{
    background:#dc2626;
    color:#fff;
    border:none;
    padding:8px 12px;
    border-radius:6px;
    cursor:pointer;
}

.btnEntrada{
    background:#0284c7;
    color:#fff;
    border:none;
    padding:8px 12px;
    border-radius:6px;
    cursor:pointer;
    margin-right:6px;
}

.btnSaida{
    background:#f59e0b;
    color:#fff;
    border:none;
    padding:8px 12px;
    border-radius:6px;
    cursor:pointer;
}

button:hover{
    opacity:.9;
}

.hidden {
    display:none;
}

@media(max-width:900px){

body{
    padding:15px;
}

.grid{
    grid-template-columns:1fr;
}

.cards{
    grid-template-columns:1fr;
}

table{
    font-size:13px;
}

th,
td{
    padding:8px;
}

}

</style>

</head>

<body>

<div class="container">

<header>

<h1>📦 SmartAssist Estoque</h1>

<p>Controle rápido de capinhas, películas e acessórios</p>

</header>

<p id="statusUsuario" style="margin-top:12px;color:#6b7280;">Carregando estoque compartilhado...</p>

<section class="cards">

<div class="card">

<h3>Produtos</h3>

<h2 id="totalProdutos">0</h2>

</div>

<div class="card">

<h3>Itens</h3>

<h2 id="totalItens">0</h2>

</div>

<div class="card">

<h3>Valor Estoque</h3>

<h2 id="valorTotal">

R$ 0,00

</h2>

</div>

</section>

<section class="cadastro">

<h2>

Cadastrar Produto

</h2>

<div class="grid">

<div>

<label for="marca">

Marca

</label>

<input

type="text"

id="marca"

placeholder="Apple"

>

</div>

<div>

<label for="categoria">

Categoria

</label>

<select id="categoria">

<option>

Capinha

</option>

<option>

Película

</option>

<option>

Carregador

</option>

<option>

Cabo

</option>

<option>

Tela

</option>

<option>

Bateria

</option>

<option>

Peça

</option>

<option>

Outro

</option>

</select>

</div>

<div>

<label for="modelo">

Modelo

</label>

<input

id="modelo"

placeholder="iPhone 13"

>

</div>

<div>

<label for="cor">

Cor

</label>

<input

id="cor"

placeholder="Transparente"

>

</div>

<div>

<label for="quantidade">

Quantidade

</label>

<input

id="quantidade"

type="number"

value="1"

>

</div>

<div>

<label for="valor">

Valor Venda

</label>

<input

id="valor"

type="number"

step="0.01"

placeholder="39.90"

>

</div>

<div>

<label for="localizacao">

Localização

</label>

<input

id="localizacao"

placeholder="Gaveta A1"

>

</div>

<div class="botaoSalvar">

<button

id="btnSalvar"

onclick="salvarProduto()"

>

Salvar Produto

</button>

</div>

</div>

</section>

<section class="pesquisa">

<input

id="pesquisa"

placeholder="Pesquisar produto..."

onkeyup="renderizar()"

>

</section>

<section class="acoes">

<button

onclick="exportarBackup()"

>

Exportar Backup

</button>

<label class="importar">

Importar Backup

<input

type="file"

accept=".json"

hidden

onchange="importarBackup(event)"

>

</label>

<button

class="limpar"

onclick="limparTudo()"

>

Limpar Tudo

</button>

</section>

<section class="tabela">

<table>

<thead>

<tr>

<th>

Marca

</th>

<th>

Categoria

</th>

<th>

Modelo

</th>

<th>

Cor

</th>

<th>

Qtd

</th>

<th>

Venda

</th>

<th>

Local

</th>

<th>

Ações

</th>

</tr>

</thead>

<tbody

id="tabela"

>

</tbody>

</table>

</section>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.27.0/firebase-app.js";
import {
    getFirestore,
    collection,
    doc,
    addDoc,
    setDoc,
    deleteDoc,
    getDocs,
    onSnapshot,
    writeBatch
} from "https://www.gstatic.com/firebasejs/9.27.0/firebase-firestore.js";

let produtos = [];
let editando = null;
let firestore = null;
const PRODUTOS_COLLECTION = "produtos";

const $ = (id) => document.getElementById(id);

function atualizarStatus(texto) {
    $("statusUsuario").textContent = texto;
}

async function inicializarFirebase() {
    const firebaseConfig = {
        apiKey: "AIzaSyAAqvdY8BCxU39QJbLlJcCIFECYpIq3er0",
        authDomain: "smartassist-estoque.firebaseapp.com",
        projectId: "smartassist-estoque",
        storageBucket: "smartassist-estoque.firebasestorage.app",
        messagingSenderId: "137074553062",
        appId: "1:137074553062:web:944a881679ccc7e3410b27"
    };

    const configValida = !Object.values(firebaseConfig).some(valor =>
        typeof valor === "string" && (valor.startsWith("SUA_") || valor.startsWith("SEU_"))
    );

    if (!configValida) {
        console.warn("Firebase não está configurado. Os dados serão salvos apenas no dispositivo local.");
        atualizarStatus("Firebase não está configurado. Usando modo local.");
        carregarProdutosLocal();
        renderizar();
        return;
    }

    try {
        const app = initializeApp(firebaseConfig);
        firestore = getFirestore(app);
        atualizarStatus("Conectado ao Firestore. Estoque público compartilhado.");
        await carregarProdutosCloud();
        startRealtimeListener();
        renderizar();
    } catch (error) {
        console.error("Erro ao inicializar Firebase:", error);
        atualizarStatus("Erro ao conectar com o Firestore. Usando modo local.");
        carregarProdutosLocal();
        renderizar();
    }
}

function normalizarProdutos(lista) {
    return lista.map(produto => {
        if (!produto.marca && produto.nome) {
            produto.marca = produto.nome;
        }
        return produto;
    });
}

function carregarProdutosLocal() {
    const backupLocal = localStorage.getItem("produtos");
    produtos = backupLocal ? normalizarProdutos(JSON.parse(backupLocal)) : [];
}

async function carregarProdutosCloud() {
    if (!firestore) {
        carregarProdutosLocal();
        return;
    }

    try {
        const querySnapshot = await getDocs(collection(firestore, PRODUTOS_COLLECTION));
        produtos = querySnapshot.docs.map(docSnap => ({ id: docSnap.id, ...docSnap.data() }));
        produtos = normalizarProdutos(produtos);
        salvarLocal();
    } catch (error) {
        console.error("Erro ao carregar produtos da nuvem:", error);
        carregarProdutosLocal();
    }
}

function startRealtimeListener() {
    if (!firestore) return;

    const produtosRef = collection(firestore, PRODUTOS_COLLECTION);
    onSnapshot(produtosRef, (snapshot) => {
        produtos = snapshot.docs.map(docSnap => ({ id: docSnap.id, ...docSnap.data() }));
        produtos = normalizarProdutos(produtos);
        salvarLocal();
        renderizar();
    }, (error) => {
        console.error("Erro no listener do Firestore:", error);
    });
}

function salvarLocal() {
    localStorage.setItem("produtos", JSON.stringify(produtos));
}

async function salvarProdutoCloud(produto) {
    if (!firestore) return;

    const produtoData = { ...produto };
    delete produtoData.id;

    try {
        if (produto.id) {
            await setDoc(doc(firestore, PRODUTOS_COLLECTION, String(produto.id)), produtoData);
        } else {
            const novoDoc = await addDoc(collection(firestore, PRODUTOS_COLLECTION), produtoData);
            produto.id = novoDoc.id;
        }
    } catch (error) {
        console.error("Erro ao salvar produto no Firestore:", error);
    }
}

async function excluirProdutoFirestore(id) {
    if (!firestore) return;

    try {
        await deleteDoc(doc(firestore, PRODUTOS_COLLECTION, String(id)));
    } catch (error) {
        console.error("Erro ao excluir produto no Firestore:", error);
    }
}

async function limparFirestore() {
    if (!firestore) return;

    try {
        const snapshot = await getDocs(collection(firestore, PRODUTOS_COLLECTION));
        const batch = writeBatch(firestore);
        snapshot.docs.forEach(docSnap => {
            batch.delete(doc(firestore, PRODUTOS_COLLECTION, docSnap.id));
        });
        await batch.commit();
    } catch (error) {
        console.error("Erro ao limpar produtos no Firestore:", error);
    }
}

async function limparFormulario() {
    $("marca").value = "";
    $("categoria").selectedIndex = 0;
    $("modelo").value = "";
    $("cor").value = "";
    $("quantidade").value = 1;
    $("valor").value = "";
    $("localizacao").value = "";

    editando = null;
    $("btnSalvar").innerHTML = "Salvar Produto";
}

async function salvarProduto() {
    const marca = $("marca").value.trim();
    if (marca === "") {
        alert("Informe a marca do produto.");
        return;
    }

    const produto = {
        id: editando ? String(editando) : null,
        marca: marca,
        categoria: $("categoria").value,
        modelo: $("modelo").value,
        cor: $("cor").value,
        quantidade: Number($("quantidade").value),
        valor: Number($("valor").value),
        localizacao: $("localizacao").value
    };

    if (editando) {
        const indice = produtos.findIndex(p => p.id === editando);
        produtos[indice] = produto;
        await salvarProdutoCloud(produto);
    } else {
        await salvarProdutoCloud(produto);
        produtos.push(produto);
    }

    salvarLocal();
    await limparFormulario();
    renderizar();
}

function editarProduto(id) {
    const produto = produtos.find(p => p.id === id);
    if (!produto) return;

    editando = id;
    $("marca").value = produto.marca;
    $("categoria").value = produto.categoria;
    $("modelo").value = produto.modelo;
    $("cor").value = produto.cor;
    $("quantidade").value = produto.quantidade;
    $("valor").value = produto.valor;
    $("localizacao").value = produto.localizacao;

    $("btnSalvar").innerHTML = "Atualizar Produto";
    window.scrollTo({ top: 0, behavior: "smooth" });
}

async function excluirProduto(id) {
    if (!confirm("Deseja excluir este produto?")) return;

    produtos = produtos.filter(p => p.id !== id);
    salvarLocal();
    await excluirProdutoFirestore(id);
    renderizar();
}

function renderizar() {
    const busca = $("pesquisa").value.toLowerCase();
    const tabela = $("tabela");
    tabela.innerHTML = "";

    let totalItens = 0;
    let valorTotal = 0;

    const lista = produtos.filter(produto => {
        return (
            produto.marca.toLowerCase().includes(busca) ||
            produto.modelo.toLowerCase().includes(busca) ||
            produto.cor.toLowerCase().includes(busca) ||
            produto.categoria.toLowerCase().includes(busca) ||
            produto.localizacao.toLowerCase().includes(busca)
        );
    });

    lista.forEach(produto => {
        totalItens += produto.quantidade;
        valorTotal += produto.quantidade * produto.valor;
        tabela.innerHTML += `
<tr>
<td>${produto.marca}</td>
<td>${produto.categoria}</td>
<td>${produto.modelo}</td>
<td>${produto.cor}</td>
<td>${produto.quantidade}</td>
<td>R$ ${produto.valor.toFixed(2)}</td>
<td>${produto.localizacao}</td>
<td>
<button class="btnEntrada" onclick="entradaEstoque('${produto.id}')">+</button>
<button class="btnSaida" onclick="saidaEstoque('${produto.id}')">-</button>
<button class="btnEditar" onclick="editarProduto('${produto.id}')">Editar</button>
<button class="btnExcluir" onclick="excluirProduto('${produto.id}')">Excluir</button>
</td>
</tr>
`;
    });

    $("totalProdutos").innerHTML = lista.length;
    $("totalItens").innerHTML = totalItens;
    $("valorTotal").innerHTML = "R$ " + valorTotal.toFixed(2);
}

async function entradaEstoque(id) {
    const produto = produtos.find(p => p.id === id);
    if (!produto) return;

    const qtd = Number(prompt("Quantidade de entrada:", 1));
    if (isNaN(qtd) || qtd <= 0) return;

    produto.quantidade += qtd;
    await salvarProdutoCloud(produto);
    salvarLocal();
    renderizar();
}

async function saidaEstoque(id) {
    const produto = produtos.find(p => p.id === id);
    if (!produto) return;

    const qtd = Number(prompt("Quantidade de saída:", 1));
    if (isNaN(qtd) || qtd <= 0) return;
    if (qtd > produto.quantidade) {
        alert("Quantidade maior que o estoque.");
        return;
    }

    produto.quantidade -= qtd;
    await salvarProdutoCloud(produto);
    salvarLocal();
    renderizar();
}

function exportarBackup() {
    const json = JSON.stringify(produtos, null, 4);
    const blob = new Blob([json], { type: "application/json" });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = "backup-smartassist.json";
    link.click();
}

async function importarBackup(event) {
    const arquivo = event.target.files[0];
    if (!arquivo) return;

    const reader = new FileReader();
    reader.onload = async function (e) {
        produtos = normalizarProdutos(JSON.parse(e.target.result));
        salvarLocal();
        await limparFirestore();
        for (const produto of produtos) {
            delete produto.id;
            await salvarProdutoCloud(produto);
        }
        renderizar();
        alert("Backup importado com sucesso!");
    };
    reader.readAsText(arquivo);
}

async function limparTudo() {
    if (!confirm("Apagar TODOS os produtos?")) return;

    produtos = [];
    salvarLocal();
    await limparFirestore();
    renderizar();
}

window.onload = async function () {
    await inicializarFirebase();
    renderizar();
    console.log("SmartAssist carregado.");
};

window.salvarProduto = salvarProduto;
window.editarProduto = editarProduto;
window.excluirProduto = excluirProduto;
window.entradaEstoque = entradaEstoque;
window.saidaEstoque = saidaEstoque;
window.exportarBackup = exportarBackup;
window.importarBackup = importarBackup;
window.limparTudo = limparTudo;
window.renderizar = renderizar;
</script>

</body>

</html>
